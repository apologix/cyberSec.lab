table inet metasploit_killswitch {
    chain forward {
        type filter hook forward priority -10; policy accept;

        # Excepción explícita: Metasploit puede alcanzar solo la LAN.
        iifname "metasploitbr0" ip saddr 172.20.0.2 ip daddr 192.168.100.0/24 oifname "wlp6s0" accept

        # Todo otro tráfico directo de Metasploit por Wi-Fi queda bloqueado.
        iifname "metasploitbr0" ip saddr 172.20.0.2 oifname "wlp6s0" drop
    }
}
