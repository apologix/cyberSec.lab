table inet nuclei_killswitch {
    chain forward {
        type filter hook forward priority -10; policy accept;

        # Nuclei puede alcanzar únicamente la LAN autorizada de forma directa.
        iifname "nucleibr0" ip saddr 172.30.0.2 ip daddr 192.168.100.0/24 oifname "wlp6s0" accept

        # Toda otra salida directa por Wi-Fi queda bloqueada.
        iifname "nucleibr0" ip saddr 172.30.0.2 oifname "wlp6s0" drop
    }
}
