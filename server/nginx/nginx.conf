server_tokens off;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

limit_req_zone $binary_remote_addr zone=recon:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=honeypot:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=collector:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    client_max_body_size 32k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    keepalive_timeout 30s;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), bluetooth=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /(?:\.|\.env|Dockerfile|docker-compose|compose\.ya?ml|package(?:-lock)?\.json|requirements\.txt|\.map$) {
        return 404;
    }

    # Solo desarrollo: Vite genera módulos precompilados bajo .vite. Esta
    # excepción es más específica que la regla de dotfiles anterior.
    location ^~ /node_modules/.vite/ {
        proxy_pass http://frontend:8080;
        include /etc/nginx/proxy_params;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /api/recon {
        limit_req zone=recon burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/collector {
        limit_req zone=collector burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /honeypot/ {
        limit_req zone=honeypot burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /scripts/ {
        alias /srv/scripts/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        types { text/plain sha256; }
        add_header Content-Disposition "attachment" always;
    }

    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/proxy_params;
    }
}
