services:
  tls-runner:
    image: ghcr.io/testssl/testssl.sh:3.2
    stdin_open: true
    tty: true
    volumes:
      - ${CYBERSEC_CASES_DIR:?Defina_CYBERSEC_CASES_DIR_en_.env}:/cases:rw
    working_dir: /case
    networks:
      tls_net:
        ipv4_address: 172.35.0.2

networks:
  tls_net:
    name: tls_tls_net
    external: true
