services:
  dns-runner:
    build: .
    image: cybersec/dns-runner:local
    stdin_open: true
    tty: true
    volumes:
      - ${CYBERSEC_CASES_DIR:?Defina_CYBERSEC_CASES_DIR_en_.env}:/cases:rw
    working_dir: /case
    networks:
      dns_net:
        ipv4_address: 172.34.0.2

networks:
  dns_net:
    name: dns-runner_dns_net
    external: true
